"><main id="main"></main><aside class="rail" id="rail"></aside></div></div></div><div id="overlay"></div><div id="toast"></div>
<script>
const paths={home:'<path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/>',routine:'<path d="M9 3h6v4H9zM8 7h8l2 4v10H6V11z"/><path d="M9 14h6"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h1m3 0h1m3 0h1"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM20 2v4m-2-2h4"/>',diary:'<path d="M5 3h14v18H5zM8 7h8M8 11h8M8 15h5"/>',skin:'<path d="M12 3c-5 0-8 4-8 9s4 9 8 9 8-4 8-9-3-9-8-9Z"/><path d="M8 10h1m6 0h1m-7 5q3 2 6 0"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/>',moon:'<path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z"/>',check:'<path d="m5 12 4 4L19 6"/>',arrow:'<path d="M4 12h15m-5-5 5 5-5 5"/>',leaf:'<path d="M20 3C8 3 3 8 5 15s13 8 15-12ZM5 20 15 10"/>',chev:'<path d="m9 6 6 6-6 6"/>'};const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[n]||paths.spark}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial={products:[{id:1,type:'洗顔料',name:'ジェントル フォームクレンザー',brand:'SKINS LAB',art:'white',time:'am'},{id:2,type:'化粧水',name:'ハイドレーティング トナー',brand:'BOTANICAL NOTES',art:'',time:'am'},{id:3,type:'美容液',name:'ビタミンC グロウセラム',brand:'DAILY FORMULA',art:'amber',time:'am'},{id:4,type:'日焼け止め',name:'デイリー UVミルク SPF50+',brand:'SKINS LAB',art:'white',time:'am'},{id:5,type:'クレンジング',name:'マイルド クレンジングオイル',brand:'BOTANICAL NOTES',art:'',time:'pm'},{id:6,type:'化粧水',name:'ハイドレーティング トナー',brand:'BOTANICAL NOTES',art:'',time:'pm'},{id:7,type:'美容液',name:'レチノール ナイトセラム',brand:'DAILY FORMULA',art:'amber',time:'pm'},{id:8,type:'クリーム',name:'セラミド モイスチャークリーム',brand:'SKINS LAB',art:'jar',time:'pm'}],done:{},plan:['保湿','レチノール','保湿','保湿','レチノール','保湿','保湿'],records:[{date:'2026-10-23',mood:'良い',sleep:'7.5',acne:'あご',treatment:'',memo:'頬の乾燥が少し落ち着いた。'},{date:'2026-10-22',mood:'ふつう',sleep:'6.5',acne:'なし',treatment:'',memo:'夜は保湿を中心に。'}],skin:'混合肌',saved:[]};initial.products.push({id:9,type:'導入美容液',name:'ファースト ブースター',brand:'SKINS LAB',art:'amber',time:'am'},{id:10,type:'アイクリーム',name:'モーニング アイクリーム',brand:'DAILY FORMULA',art:'jar',time:'am'},{id:11,type:'乳液',name:'バランス ミルク',brand:'BOTANICAL NOTES',art:'white',time:'am'},{id:12,type:'リップケア',name:'デイ リップバーム',brand:'SKINS LAB',art:'white',time:'am'},{id:13,type:'洗顔料',name:'ナイト フォームウォッシュ',brand:'SKINS LAB',art:'white',time:'pm'},{id:14,type:'美容液',name:'モイスチャー セラム',brand:'DAILY FORMULA',art:'amber',time:'pm'},{id:15,type:'アイクリーム',name:'ナイト アイクリーム',brand:'BOTANICAL NOTES',art:'jar',time:'pm'},{id:16,type:'リップケア',name:'ナイト リップマスク',brand:'SKINS LAB',art:'jar',time:'pm'});let state;try{state=JSON.parse(localStorage.getItem('skins-demo-v1'))||initial}catch{state=initial}var shelfEditing=false,shelfSnapshot=null,editingProductId=null;let page='home',time=Number(new Intl.DateTimeFormat('en',{timeZone:'Asia/Tokyo',hour:'numeric',hourCycle:'h23'}).format(new Date()))>=16?'pm':'am',selectedDay=6,weekOffset=0,diagnosisStep=0,answers=[],chat=[];const save=()=>{if(shelfEditing)return;try{localStorage.setItem('skins-demo-v1',JSON.stringify(state))}catch{toast('保存できませんでした。ブラウザの空き容量をご確認ください。')}};const navs=[['home','routine','My Cosmetics'],['ai','spark','相談'],['records','diary','記録']];
function navigate(p){if(shelfEditing){toast('保存かキャンセルで編集を終了できます');return}page=p;render();window.scrollTo({top:0,behavior:'smooth'})}function render(){document.body.dataset.editing=String(shelfEditing);document.body.dataset.page=page;document.getElementById('nav').innerHTML=navs.map(([p,i,n])=>`<button onclick="navigate('${p}')" class="${(page===p||(p==='routine'&&['calendar','ai','diagnosis'].includes(page)))?'active':''}">${icon(i)}${n}${p==='ai'?'<span class="dot"></span>':''}</button>`).join('');document.getElementById('crumb').textContent=({home:'今日のケア',routine:'マイケア',records:'記録',calendar:'マイケア / 週間予定',ai:'マイケア / ケアの見直し',diagnosis:'マイケア / 肌プロフィール'}[page]);document.getElementById('profileType').textContent=state.skin+'・ゆらぎやすい肌';document.getElementById('main').innerHTML=({home:home,routine:routinePage,calendar:calendarPage,ai:aiPage,records:recordsPage,diagnosis:diagnosisPage}[page])();renderRail();syncShelfPagers()}
function heading(ey,title,sub){return `<div class="heading"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="date-mark">OCTOBER<strong>24 <span style="font-size:12px">SAT</span></strong></div></div>`}function weekDates(){return Array.from({length:7},(_,i)=>{const d=new Date(2026,9,19+weekOffset*7+i);return {date:d,day:d.getDate(),key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}})}const dayName=['月','火','水','木','金','土','日'];function weekHeader(){const ds=weekDates();return `<div class="section-head"><h2>今週のケア<span class="en">WEEKLY PLAN</span></h2><div style="display:flex;gap:12px;align-items:center"><button aria-label="前の週" onclick="weekOffset--;render()">‹</button><span class="small">${ds[0].date.getMonth()+1}/${ds[0].day} – ${ds[6].date.getMonth()+1}/${ds[6].day}</span><button aria-label="次の週" onclick="weekOffset++;render()">›</button></div></div>`}function weekly(){return weekHeader()+`<div class="week">${weekDates().map((d,i)=>`<button class="day ${selectedDay===i?'selected':''}" onclick="selectedDay=${i};render()" aria-label="${d.day}日 ${state.plan[i]}"><span>${dayName[i]}</span><strong>${d.day}</strong>${icon(state.plan[i]==='レチノール'?'moon':'leaf')}<i class="${state.plan[i]==='レチノール'?'ret':''}">${state.plan[i]}</i></button>`).join('')}</div>`}
function products(){const key=weekDates()[selectedDay].key+'-'+time;const ps=state.products.filter(p=>p.time===time&&(page==='routine'||!p.name.includes('レチノール')||state.plan[selectedDay]==='レチノール'));return `<div class="routine-tabs"><button class="${time==='am'?'active':''}" onclick="time='am';render()">${icon('sun')} 朝のスキンケア</button><button class="${time==='pm'?'active':''}" onclick="time='pm';render()">${icon('moon')} 夜のスキンケア</button>${page!=='routine'?`<span class="count">${ps.filter(p=>state.done[key+'-'+p.id]).length} / ${ps.length} 完了</span>`:''}</div>${ps.map((p,i)=>{let done=state.done[key+'-'+p.id];return `<div class="product ${done?'completed':''}" style="animation-delay:${i*35}ms"><span class="step">${String(i+1).padStart(2,'0')}</span><div class="product-art"><div class="bottle ${p.art}"></div></div><div class="product-info"><div class="product-type">${esc(p.type)}</div><div class="product-name">${esc(p.name)}</div><div class="product-brand">${esc(p.brand)}</div></div>${page==='routine'?`<button class="delete" onclick="removeProduct(${p.id})" aria-label="${esc(p.name)}を削除">削除</button>`:''}<button style="${page==='routine'?'display:none':''}" class="check ${done?'done':''}" onclick="toggleDone(${p.id})" aria-label="${esc(p.name)} ${done?'完了を取り消す':'完了にする'}" aria-pressed="${!!done}">${icon('check')}</button></div>`}).join('')}<button class="add-line" style="${page==='routine'?'display:none':''}" onclick="openProduct()">＋ アイテムを追加する</button>`}
function toggleDone(id){let key=weekDates()[selectedDay].key+'-'+time+'-'+id;state.done[key]=!state.done[key];save();render()}function home(){return `<div class="page">${heading('YOUR DAILY SKIN NOTE','おはよう、Mizukiさん。','今日の肌と、いつものケアを整えましょう。')}<div class="overview"><div class="metric"><label>肌のコンディション</label><strong style="font-size:20px" class="good">${esc(state.records[0]?.mood||'未記録')}</strong><div class="hint">直近の記録より</div></div><div class="metric"><label>昨夜の睡眠</label><strong>${esc(state.records[0]?.sleep||'—')}</strong><em>時間</em><div class="hint">${esc(state.records[0]?.date||'記録をはじめよう')}</div></div><div class="metric"><label>今週の記録</label><strong>${new Set(state.records.filter(r=>r.date>='2026-10-19'&&r.date<='2026-10-25').map(r=>r.date)).size}</strong><em>/ 7 日</em><div class="hint">少しずつ、肌を知る</div></div></div>${weekly()}<div class="section-head"><h2>${weekDates()[selectedDay].day}日のルーティン<span class="en">DAILY ROUTINE</span></h2><button class="text-link" onclick="navigate('routine')">管理する ${icon('arrow')}</button></div>${products()}<div class="note">${icon('leaf')}今夜は${esc(state.plan[selectedDay])}の日。肌の調子も一緒に記録しましょう。</div><div class="bottom-caption"><span>小さな積み重ねを、肌の理解に。</span><span>SKINS JOURNAL — 2026</span></div></div>`}
function routinePage(){return heading('MY ROUTINE','マイルーティン','使っているアイテムを、朝と夜に分けて管理。')+products()+`<div class="note">${icon('spark')}登録したラインナップをもとに、AIの改善提案を確認できます。</div><button class="btn" style="margin-top:20px" onclick="navigate('ai')">ラインナップを見直す ${icon('arrow')}</button>`}function removeProduct(id){state.products=state.products.filter(p=>p.id!==id);save();render();toast('アイテムを削除しました')}
function calendarPage(){return heading('CARE CALENDAR','ケアカレンダー','曜日ごとのケア方針をタップして編集できます。')+weekHeader()+`<div class="calendar-week">${weekDates().map((d,i)=>`<div class="calendar-cell"><span class="small">${dayName[i]}</span><strong>${d.day}</strong><button onclick="openPlan(${i})">${icon(state.plan[i]==='レチノール'?'moon':'leaf')}<br>${esc(state.plan[i])}<br><span style="font-size:8px">編集する</span></button></div>`).join('')}</div><div class="note" style="margin-top:25px">${icon('calendar')}曜日ごとの繰り返しプランです。変更は各週に反映されます。</div>`}
function renderRail(){document.getElementById('rail').innerHTML=`<div class="rail-title"><b>${icon('spark')} Skins AI</b><span class="ai-badge">DEMO</span></div><div class="ai-intro">今のケアから、<br>次の一歩を。</div><div class="insight"><div class="label">ROUTINE INSIGHT</div><h3>${state.products.some(p=>p.time==='pm'&&p.type==='クリーム')?'夜の保湿アイテムが登録済みです。':'夜の保湿を、見直すきっかけに。'}</h3><p>${state.products.length}点のラインナップと、${esc(state.skin)}のプロフィールを確認できます。</p><button class="text-link" onclick="navigate('ai')">改善のヒントを見る ${icon('arrow')}</button></div><div class="insight"><div class="label">FOR YOUR SKIN</div><h3>次に選ぶなら、どんなアイテム？</h3><p>肌の悩みと今のケアに合わせて、候補をチェック。</p><button class="text-link" onclick="navigate('ai');document.getElementById('recommendations').scrollIntoView({behavior:'smooth'})">おすすめを見る ${icon('arrow')}</button></div><button class="btn" onclick="openChat()">${icon('spark')} AIに相談する ${icon('arrow')}</button><div class="editorial"><img src="skincare.jpg" alt="植物と並ぶスキンケアボトル"><div><span class="eyebrow">A MOMENT FOR YOUR SKIN</span><strong>肌を知ることから。</strong></div></div><div class="record-short"><h3>今日の小さな変化を残そう。</h3><p>肌の調子、睡眠、気になったこと。<br>ひとつの記録が、次のケアのヒントに。</p><button class="text-link" onclick="openRecord()">今日の記録をつける ${icon('arrow')}</button><div class="small" style="margin-top:18px;font-size:8px">提案・商品・プロフィールはデモです。<br>診断や治療を行うものではありません。</div></div>`}
const suggestions=[{name:'バリア モイスチャークリーム',type:'保湿クリーム',brand:'SKINS LAB',art:'jar',reason:'シンプルな保湿を中心にした候補。乾燥が気になる日のケアに。'},{name:'マイルド デイリークレンザー',type:'洗顔料',brand:'DAILY FORMULA',art:'white',reason:'洗顔後のつっぱりを記録しながら、使用感を比較する候補。'}];function aiPage(){let cream=state.products.some(p=>p.time==='pm'&&p.type==='クリーム');return heading('SKINS INTELLIGENCE','あなたのケアを、一緒に見直す。','登録したアイテムとプロフィールを使った提案例です。')+`<span class="tag">${state.products.length} アイテム</span><span class="tag">${esc(state.skin)}</span><span class="tag">デモ分析</span><div class="list-row"><div><div class="eyebrow">01 / ROUTINE REVIEW</div><h3 style="margin-top:12px">${cream?'夜の保湿ステップが整っています。':'夜の保湿ステップをチェック。'}</h3><p>${cream?'クリームが夜のラインナップに登録されています。使用感や乾燥の変化を記録してみましょう。':'夜のラインナップにクリームがありません。乾燥が気になる場合は、保湿アイテムを検討するきっかけに。'}</p></div>${icon('leaf')}</div><div class="list-row"><div><div class="eyebrow">02 / WEEKLY BALANCE</div><h3 style="margin-top:12px">レチノールの使用日を、カレンダーで管理。</h3><p>現在は週${state.plan.filter(p=>p==='レチノール').length}日の設定です。使用頻度は製品の案内や肌の状態に合わせて確認しましょう。</p><button class="text-link" style="margin-top:13px" onclick="navigate('calendar')">スケジュールを確認 ${icon('arrow')}</button></div></div><div class="section-head" id="recommendations" style="margin-top:32px"><h2>あなたへの商品候補</h2><span class="small">架空の商品・提案例</span></div>${suggestions.map((p,i)=>`<div class="list-row" style="align-items:flex-start"><div class="product-art" style="width:75px;height:90px"><div class="bottle ${p.art}" style="transform:scale(1.35)"></div></div><div style="flex:1"><div class="small">${p.brand}</div><h3 style="margin-top:5px">${p.name}</h3><p>${p.reason}</p><button class="text-link" style="margin-top:12px" onclick="saveSuggestion(${i})">${state.saved.includes(i)?'✓ 保存済み':'＋ 気になるリストに保存'}</button></div></div>`).join('')}<div class="note">${icon('spark')}実際のAI解析・商品検索には接続していないデモです。</div>`}function saveSuggestion(i){state.saved=state.saved.includes(i)?state.saved.filter(n=>n!==i):[...state.saved,i];save();render();toast(state.saved.includes(i)?'気になるリストに保存しました':'保存を解除しました')}
function recordsPage(){return heading('','記録','肌・睡眠・ニキビ・美容施術の変化を振り返る。')+(!state.customSetup?'<span class="sample-label">サンプルの記録を表示中</span>':'')+`<div class="toolbar"><h2 style="font-size:14px;font-weight:500">睡眠の記録</h2><button class="btn primary" onclick="openRecord()">＋ 記録を追加</button></div>${state.records.length?`<div class="chart">${state.records.slice(0,7).reverse().map(r=>`<div class="bar" style="height:${Math.min(100,Math.max(0,Number(r.sleep)/24*100))}%"><span>${esc(r.sleep)}h</span><i>${esc(r.date.slice(5).replace('-','/'))}</i></div>`).join('')}</div>`:''}<div class="section-head" style="margin-top:50px"><h2>記録のタイムライン</h2><span class="small">${state.records.length} 件</span></div>${state.records.length?state.records.map((r,i)=>`<div class="list-row"><div><div class="eyebrow">${esc(r.date.replaceAll('-',' / '))}</div><h3 style="margin-top:12px">${esc(r.mood)} <span class="small">・睡眠 ${esc(r.sleep)}時間</span></h3><span class="tag">ニキビ：${esc(r.acne)}</span>${r.treatment?`<span class="tag">施術：${esc(r.treatment)}</span>`:''}<p>${esc(r.memo)}</p></div><button class="delete" onclick="deleteRecord(${i})">削除</button></div>`).join(''):'<div class="empty">最初の記録を残してみましょう。</div>'}`}
function deleteRecord(i){state.records.splice(i,1);save();render();toast('記録を削除しました')}
const questions=[{title:'洗顔後、肌はどんな状態ですか？',options:['全体的につっぱる','Tゾーンだけ皮脂が出る','全体的に皮脂が出る','気にならない']},{title:'最近、気になることは？',options:['乾燥','毛穴・皮脂','ニキビ','特になし']},{title:'化粧品で刺激を感じますか？',options:['よく感じる','ときどき感じる','ほとんど感じない']}];function diagnosisPage(){if(diagnosisStep>=3)return heading('SKIN PROFILE','あなたの肌プロフィール','回答をもとにしたセルフチェックの参考結果です。')+`<div class="result"><span class="eyebrow">YOUR SKIN TYPE</span><h2>${esc(state.skin)}</h2><p class="sub">${answers[0]===1?'Tゾーンと頬で、使用感の違いを記録してみましょう。':'日ごとの肌の変化を、ケアの記録と一緒に振り返りましょう。'}</p><span class="tag">気になること：${esc(questions[1].options[answers[1]])}</span><span class="tag">刺激：${esc(questions[2].options[answers[2]])}</span></div><button class="btn primary" onclick="navigate('ai')">プロフィールに合う提案例を見る ${icon('arrow')}</button><button class="text-link" style="display:block;margin-top:20px" onclick="diagnosisStep=0;answers=[];render()">もう一度チェックする</button><p class="small" style="margin-top:25px">このセルフチェックは医療上の診断ではありません。</p>`;let q=questions[diagnosisStep];return heading('SKIN CHECK','今の肌を、知る。','3つの質問で、肌のプロフィールを作りましょう。')+`<div class="eyebrow" style="margin-top:45px">QUESTION 0${diagnosisStep+1} / 03</div><h2 style="font-size:20px;font-weight:500;margin-top:18px">${q.title}</h2><div class="diagnosis-choices">${q.options.map((o,i)=>`<button class="choice ${answers[diagnosisStep]===i?'selected':''}" onclick="answers[diagnosisStep]=${i};render()">${o}</button>`).join('')}</div><button class="btn primary" onclick="nextQuestion()">${diagnosisStep===2?'結果を見る':'次の質問へ'} ${icon('arrow')}</button>${diagnosisStep?`<button class="text-link" style="margin-left:18px" onclick="diagnosisStep--;render()">戻る</button>`:''}`}function nextQuestion(){if(answers[diagnosisStep]===undefined){toast('回答を選んでください');return}diagnosisStep++;if(diagnosisStep===3){state.diagnosisComplete=true;state.skin=['乾燥肌傾向','混合肌傾向','脂性肌傾向','普通肌傾向'][answers[0]];save()}render()}

function openShelfItem(id){const p=state.products.find(p=>p.id===id);if(!p)return;const rest=onRest(p),done=state.done[shelfKey(p.time,p.id)];modal(p.type,`<div class="product-detail"><div class="detail-art">${cosmetic(p,'detail')}</div><span class="eyebrow">${esc(p.brand)}</span><h3>${esc(p.name)}</h3><div class="detail-meta"><span>${p.time==='am'?'朝':'夜'}のスキンケア</span><span>${rest?'今日はおやすみ':done?'✓ 完了':'未チェック'}</span></div>${rest?'<button class="btn primary" onclick="closeModal();openPlan(selectedDay)">使用日を変更</button>':`<button class="btn primary" onclick="toggleShelfItem(${id})">${done?'完了を取り消す':'使ったらチェック ✓'}</button>`}<button class="text-link" style="margin-top:18px;color:#98a8bc" onclick="removeProduct(${id});closeModal()">棚から外す</button></div>`)}

aiPage=function(){const cream=state.products.some(p=>p.time==='pm'&&p.type==='クリーム');return backToCare()+heading('','Skins picks.','')+`<div class="list-row"><div><span class="eyebrow">YOUR ROUTINE</span><h3 style="margin-top:10px">${cream?'夜の保湿、続けてみよう。':'夜の保湿を、もう少し。'}</h3><p>${cream?'肌の変化を記録してみましょう。':'今の夜ケアに、クリームは未登録です。'}</p></div>${icon('spark')}</div><div class="list-row"><div><h3>今週のレチノール</h3><p>${state.plan.map((p,i)=>p==='レチノール'?dayName[i]:'').filter(Boolean).join('・')||'設定なし'}</p></div><button class="text-link" onclick="navigate('routine')">予定を編集 →</button></div><div class="section-head" id="recommendations" style="margin-top:30px"><h2>気になる、次の1本。</h2><span class="sample-label">商品はデモ</span></div>${suggestions.map((p,i)=>`<div class="list-row"><div style="width:70px;flex-shrink:0">${cosmetic({...p,id:100+i},'rec')}</div><div style="flex:1"><span class="small">${p.brand}</span><h3 style="margin-top:7px">${p.name}</h3><p>${i===0?'乾燥が気になる日の保湿に。':'洗いあがりの使用感を比べたいときに。'}</p><button class="text-link" style="margin-top:12px" onclick="saveSuggestion(${i})">${state.saved.includes(i)?'✓ 保存済み':'＋ 保存する'}</button></div></div>`).join('')}<p class="muted-note">AI・商品提案はデモです。</p>`};

function productDays(p){if(Array.isArray(p.days))return p.days;return p.name.includes('レチノール')?state.plan.map((v,i)=>v==='レチノール'?i:-1).filter(i=>i>=0):[0,1,2,3,4,5,6]}
function productDaysLabel(p){if(p.scheduleLabel)return p.scheduleLabel;if(p.asNeeded)return '必要な日';const d=[...new Set(productDays(p))].sort((a,b)=>a-b);if(d.length===7)return '毎日';if(!d.length)return '未設定';if(d.join(',')==='0,1,2,3,4')return '平日';return d.map(i=>dayName[i]).join(d.length<=3?'・':'')}
function syncRetinolDays(){const ret=state.products.filter(p=>p.name.includes('レチノール'));if(ret.length)state.plan=state.plan.map((v,i)=>ret.some(p=>productDays(p).includes(i))?'レチノール':v==='レチノール'?'保湿':v)}

function openProductEditor(id){const p=id===null?null:state.products.find(p=>p.id===id);if(id!==null&&!p)return;itemDraft={id,days:p?[...productDays(p)]:[0,1,2,3,4,5,6]};const types=[...new Set(['クレンジング','洗顔料','化粧水','導入美容液','美容液','乳液','アイクリーム','クリーム','日焼け止め','リップケア','その他',...(p?[p.type]:[])])];modal(p?'コスメを編集':'コスメを追加',`<form onsubmit="saveProductEditor(event)"><div class="field"><label for="item-name">商品名</label><input id="item-name" name="name" value="${esc(p?.name||'')}" maxlength="70" required placeholder="アイテム名"></div><div class="field"><label for="item-brand">ブランド</label><input id="item-brand" name="brand" value="${esc(p?.brand||'')}" maxlength="50" placeholder="任意"></div><div class="form-grid"><div class="field"><label for="item-type">種類</label><select id="item-type" name="type">${types.map(v=>`<option ${p?.type===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field"><label for="item-time">使う時間</label><select id="item-time" name="time"><option value="am" ${(p?.time||time)==='am'?'selected':''}>朝</option><option value="pm" ${(p?.time||time)==='pm'?'selected':''}>夜</option><option value="both">朝と夜</option></select></div></div><div class="field"><div class="day-field-head"><label>使う曜日</label><button class="daily-toggle ${itemDraft.days.length===7?'selected':''}" type="button" onclick="setDailyItem(this)" aria-pressed="${itemDraft.days.length===7}">毎日</button></div><div class="item-day-picker" role="group" aria-label="使う曜日">${dayName.map((v,i)=>`<button type="button" data-day="${i}" class="${itemDraft.days.includes(i)?'selected':''}" onclick="toggleItemDay(${i},this)" aria-pressed="${itemDraft.days.includes(i)}" aria-label="${v}曜日">${v}</button>`).join('')}</div><span class="day-selection-label" id="day-selection-label">${esc(productDaysLabel({name:'',days:itemDraft.days}))}</span></div><button class="btn primary">${p?'変更を保存':'棚に追加'}</button>${p?`<button type="button" class="remove-item-link" onclick="removeEditedItem(${p.id})">棚から外す</button>`:''}</form>`)}
function refreshDayPicker(){document.querySelectorAll('.item-day-picker button').forEach(b=>{const active=itemDraft.days.includes(Number(b.dataset.day));b.classList.toggle('selected',active);b.setAttribute('aria-pressed',String(active))});const daily=document.querySelector('.daily-toggle');daily.classList.toggle('selected',itemDraft.days.length===7);daily.setAttribute('aria-pressed',String(itemDraft.days.length===7));document.getElementById('day-selection-label').textContent=productDaysLabel({name:'',days:itemDraft.days})}
function toggleItemDay(i){itemDraft.days=itemDraft.days.includes(i)?itemDraft.days.filter(d=>d!==i):[...itemDraft.days,i];refreshDayPicker()}
function setDailyItem(){itemDraft.days=itemDraft.days.length===7?[]:[0,1,2,3,4,5,6];refreshDayPicker()}
function saveProductEditor(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!f.name.trim()){toast('商品名を入力してください');return}if(!itemDraft.days.length){toast('使う曜日を選んでください');return}state.products.forEach(p=>{if(!Array.isArray(p.days))p.days=[...productDays(p)]});const existing=state.products.find(p=>p.id===itemDraft.id),targets=f.time==='both'?['am','pm']:[f.time];const value={name:f.name.trim(),brand:f.brand.trim()||'MY SKINCARE',type:f.type,days:[...itemDraft.days].sort((a,b)=>a-b),art:f.type.includes('クリーム')||f.type==='リップケア'?'jar':f.type.includes('美容液')?'amber':'white'};if(existing){const oldName=existing.name,oldBrand=existing.brand;Object.assign(existing,value,{time:targets[0]});if(targets.length===2){const other=state.products.find(p=>p.id!==existing.id&&p.name===oldName&&p.brand===oldBrand&&p.time===targets[1]);if(other)Object.assign(other,value,{time:targets[1]});else state.products.push({...value,days:[...value.days],time:targets[1],id:Date.now()})}}else targets.forEach((t,i)=>state.products.push({...value,days:[...value.days],time:t,id:Date.now()+i}));syncRetinolDays();save();closeModal();render();toast(existing?'コスメを更新しました':'棚に追加しました')}
function removeEditedItem(id){state.products=state.products.filter(p=>p.id!==id);syncRetinolDays();save();closeModal();render();toast('棚から外しました')}

function openPlan(i){modal(`${dayName[i]}曜日のケア`,`<form onsubmit="savePlanDay(event,${i})"><div class="field"><label for="plan">ケアの方針</label><select id="plan" name="plan">${['保湿','レチノール','お休み','スペシャルケア'].map(v=>`<option ${state.plan[i]===v?'selected':''}>${v}</option>`).join('')}</select></div><button class="btn primary">保存</button></form>`)}

function brandLabel(p){return /^anua$/i.test(p.brand)?'ANUA':p.brand||'MY COSMETICS'}

function cosmeticCard(p,all){return `<div class="product-card edit-slot ${editingProductId===p.id?'selected':''}" ${shelfEditing?`draggable="true" ondragstart="startShelfDrag(event,${p.id})" ondragover="event.preventDefault()" ondrop="dropShelfProduct(event,${p.id})"`:''}>${shelfEditing?`<div class="product-card-tools"><button onclick="removeDraftProduct(${p.id})" aria-label="${esc(p.name)}を外す">−</button></div>`:''}<button class="shelf-slot product-card-button" onclick="openShelfItem(${p.id})" aria-label="${esc(p.name)}の詳細・${esc(productDaysLabel(p))}"><span class="product-image-panel"><span class="routine-step" aria-label="順番 ${cardStep(p,all)}">${cardStep(p,all)}</span>${cosmetic(p,p.time)}</span><span class="cosmetic-meta"><span class="cosmetic-tags">${productTags(p).map(tag=>`<span class="cosmetic-chip ${tagTone(tag,p)}">${esc(tag)}</span>`).join('')}</span></span></button></div>`}
state.products.forEach(p=>{const ref=nightReferenceProducts.find(r=>r.id===p.id);if([5101,5104,5105].includes(p.id)&&ref&&p.imageUrl===ref.imageUrl)p.cutoutUrl='assets/products/'+p.id+'.png'});save();


function tagTone(tag,p){if(tag===brandLabel(p))return 'tag-brand';return ({'PDRN':'tag-pdrn','ビタミンC':'tag-vitamin','アゼライン酸':'tag-azelaic','レチナール':'tag-retinal'})[tag]||'tag-category'}
function productTags(p){const ingredient=/PDRN/i.test(p.name)?'PDRN':/ビタミン|PORESTRIX/i.test(p.name)?'ビタミンC':/アゼライン酸/.test(p.name)?'アゼライン酸':/レチナール/.test(p.name)?'レチナール':null;return [...new Set([ingredient||productCategory(p),brandLabel(p),...(ingredient?[productCategory(p)]:[])])]}
const cleanUrl=new URL(location.href);if(cleanUrl.searchParams.has('design')){cleanUrl.searchParams.delete('design');history.replaceState(null,'',cleanUrl.pathname+cleanUrl.search+cleanUrl.hash)}

function toggleCollectionMode(){if(shelfEditing)return;collectionMode=collectionMode==='shelf'?'cards':'shelf';try{localStorage.setItem('skins-collection-mode-v2',collectionMode)}catch{}render()}
function shelfRole(p){return /PDRN/i.test(p.name)?'保湿美容液':/ビタミン|PORESTRIX/i.test(p.name)?'ビタミンC美容液':/アゼライン酸/.test(p.name)?'アゼライン酸美容液':/レチナール/.test(p.name)?'レチナール美容液':productCategory(p)}
function collectionCard(p,all){if(shelfEditing||collectionMode!=='shelf')return cosmeticCard(p,all);return `<div class="product-card shelf-product"><button class="shelf-slot shelf-product-button" onclick="openShelfItem(${p.id})" aria-label="${esc(p.name)}の詳細"><span class="shelf-step" aria-label="順番 ${cardStep(p,all)}">${cardStep(p,all)}</span><span class="shelf-photo" style="--product-ratio:${shelfImageRatio(p)}">${groundedProduct(p)}</span><span class="shelf-caption"><span class="shelf-brand">${esc(brandLabel(p))}</span><span class="shelf-role">${esc(shelfRole(p))}</span>${[5104,5105].includes(p.id)?`<span class="shelf-days">${productDays(p).map(i=>dayName[i]).join('')}</span>`:''}</span></button></div>`}
