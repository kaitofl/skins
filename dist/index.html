function navigate(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}function render(){document.body.dataset.page=page;document.getElementById('nav').innerHTML=navs.map(([p,i,n])=>`<button onclick="navigate('${p}')" class="${(page===p||(p==='routine'&&['calendar','ai','diagnosis'].includes(page)))?'active':''}">${icon(i)}${n}${p==='ai'?'<span class="dot"></span>':''}</button>`).join('');document.getElementById('crumb').textContent=({home:'今日のケア',routine:'マイケア',records:'記録',calendar:'マイケア / 週間予定',ai:'マイケア / ケアの見直し',diagnosis:'マイケア / 肌プロフィール'}[page]);document.getElementById('profileType').textContent=state.skin+'・ゆらぎやすい肌';document.getElementById('main').innerHTML=({home:home,routine:routinePage,calendar:calendarPage,ai:aiPage,records:recordsPage,diagnosis:diagnosisPage}[page])();renderRail();syncShelfPagers()}
function heading(ey,title,sub){return `<div class="heading"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="date-mark">OCTOBER<strong>24 <span style="font-size:12px">SAT</span></strong></div></div>`}function weekDates(){return Array.from({length:7},(_,i)=>{const d=new Date(2026,9,19+weekOffset*7+i);return {date:d,day:d.getDate(),key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}})}const dayName=['月','火','水','木','金','土','日'];function weekHeader(){const ds=weekDates();return `<div class="section-head"><h2>今週のケア<span class="en">WEEKLY PLAN</span></h2><div style="display:flex;gap:12px;align-items:center"><button aria-label="前の週" onclick="weekOffset--;render()">‹</button><span class="small">${ds[0].date.getMonth()+1}/${ds[0].day} – ${ds[6].date.getMonth()+1}/${ds[6].day}</span><button aria-label="次の週" onclick="weekOffset++;render()">›</button></div></div>`}function weekly(){return weekHeader()+`<div class="week">${weekDates().map((d,i)=>`<button class="day ${selectedDay===i?'selected':''}" onclick="selectedDay=${i};render()" aria-label="${d.day}日 ${state.plan[i]}"><span>${dayName[i]}</span><strong>${d.day}</strong>${icon(state.plan[i]==='レチノール'?'moon':'leaf')}<i class="${state.plan[i]==='レチノール'?'ret':''}">${state.plan[i]}</i></button>`).join('')}</div>`}
function products(){const key=weekDates()[selectedDay].key+'-'+time;const ps=state.products.filter(p=>p.time===time&&(page==='routine'||!p.name.includes('レチノール')||state.plan[selectedDay]==='レチノール'));return `<div class="routine-tabs"><button class="${time==='am'?'active':''}" onclick="time='am';render()">${icon('sun')} 朝のスキンケア</button><button class="${time==='pm'?'active':''}" onclick="time='pm';render()">${icon('moon')} 夜のスキンケア</button>${page!=='routine'?`<span class="count">${ps.filter(p=>state.done[key+'-'+p.id]).length} / ${ps.length} 完了</span>`:''}</div>${ps.map((p,i)=>{let done=state.done[key+'-'+p.id];return `<div class="product ${done?'completed':''}" style="animation-delay:${i*35}ms"><span class="step">${String(i+1).padStart(2,'0')}</span><div class="product-art"><div class="bottle ${p.art}"></div></div><div class="product-info"><div class="product-type">${esc(p.type)}</div><div class="product-name">${esc(p.name)}</div><div class="product-brand">${esc(p.brand)}</div></div>${page==='routine'?`<button class="delete" onclick="removeProduct(${p.id})" aria-label="${esc(p.name)}を削除">削除</button>`:''}<button style="${page==='routine'?'display:none':''}" class="check ${done?'done':''}" onclick="toggleDone(${p.id})" aria-label="${esc(p.name)} ${done?'完了を取り消す':'完了にする'}" aria-pressed="${!!done}">${icon('check')}</button></div>`}).join('')}<button class="add-line" style="${page==='routine'?'display:none':''}" onclick="openProduct()">＋ アイテムを追加する</button>`}
function toggleDone(id){let key=weekDates()[selectedDay].key+'-'+time+'-'+id;state.done[key]=!state.done[key];save();render()}function home(){return `<div class="page">${heading('YOUR DAILY SKIN NOTE','おはよう、Mizukiさん。','今日の肌と、いつものケアを整えましょう。')}<div class="overview"><div class="metric"><label>肌のコンディション</label><strong style="font-size:20px" class="good">${esc(state.records[0]?.mood||'未記録')}</strong><div class="hint">直近の記録より</div></div><div class="metric"><label>昨夜の睡眠</label><strong>${esc(state.records[0]?.sleep||'—')}</strong><em>時間</em><div class="hint">${esc(state.records[0]?.date||'記録をはじめよう')}</div></div><div class="metric"><label>今週の記録</label><strong>${new Set(state.records.filter(r=>r.date>='2026-10-19'&&r.date<='2026-10-25').map(r=>r.date)).size}</strong><em>/ 7 日</em><div class="hint">少しずつ、肌を知る</div></div></div>${weekly()}<div class="section-head"><h2>${weekDates()[selectedDay].day}日のルーティン<span class="en">DAILY ROUTINE</span></h2><button class="text-link" onclick="navigate('routine')">管理する ${icon('arrow')}</button></div>${products()}<div class="note">${icon('leaf')}今夜は${esc(state.plan[selectedDay])}の日。肌の調子も一緒に記録しましょう。</div><div class="bottom-caption"><span>小さな積み重ねを、肌の理解に。</span><span>SKINS JOURNAL — 2026</span></div></div>`}

function renderRail(){document.getElementById('rail').innerHTML=`<div class="rail-title"><b>${icon('spark')} Skins AI</b><span class="ai-badge">DEMO</span></div><div class="ai-intro">今のケアから、<br>次の一歩を。</div><div class="insight"><div class="label">ROUTINE INSIGHT</div><h3>${state.products.some(p=>p.time==='pm'&&p.type==='クリーム')?'夜の保湿アイテムが登録済みです。':'夜の保湿を、見直すきっかけに。'}</h3><p>${state.products.length}点のラインナップと、${esc(state.skin)}のプロフィールを確認できます。</p><button class="text-link" onclick="navigate('ai')">改善のヒントを見る ${icon('arrow')}</button></div><div class="insight"><div class="label">FOR YOUR SKIN</div><h3>次に選ぶなら、どんなアイテム？</h3><p>肌の悩みと今のケアに合わせて、候補をチェック。</p><button class="text-link" onclick="navigate('ai');document.getElementById('recommendations').scrollIntoView({behavior:'smooth'})">おすすめを見る ${icon('arrow')}</button></div><button class="btn" onclick="openChat()">${icon('spark')} AIに相談する ${icon('arrow')}</button><div class="editorial"><img src="skincare.jpg" alt="植物と並ぶスキンケアボトル"><div><span class="eyebrow">A MOMENT FOR YOUR SKIN</span><strong>肌を知ることから。</strong></div></div><div class="record-short"><h3>今日の小さな変化を残そう。</h3><p>肌の調子、睡眠、気になったこと。<br>ひとつの記録が、次のケアのヒントに。</p><button class="text-link" onclick="openRecord()">今日の記録をつける ${icon('arrow')}</button><div class="small" style="margin-top:18px;font-size:8px">提案・商品・プロフィールはデモです。<br>診断や治療を行うものではありません。</div></div>`}
const suggestions=[{name:'バリア モイスチャークリーム',type:'保湿クリーム',brand:'SKINS LAB',art:'jar',reason:'シンプルな保湿を中心にした候補。乾燥が気になる日のケアに。'},{name:'マイルド デイリークレンザー',type:'洗顔料',brand:'DAILY FORMULA',art:'white',reason:'洗顔後のつっぱりを記録しながら、使用感を比較する候補。'}];function aiPage(){let cream=state.products.some(p=>p.time==='pm'&&p.type==='クリーム');return heading('SKINS INTELLIGENCE','あなたのケアを、一緒に見直す。','登録したアイテムとプロフィールを使った提案例です。')+`<span class="tag">${state.products.length} アイテム</span><span class="tag">${esc(state.skin)}</span><span class="tag">デモ分析</span><div class="list-row"><div><div class="eyebrow">01 / ROUTINE REVIEW</div><h3 style="margin-top:12px">${cream?'夜の保湿ステップが整っています。':'夜の保湿ステップをチェック。'}</h3><p>${cream?'クリームが夜のラインナップに登録されています。使用感や乾燥の変化を記録してみましょう。':'夜のラインナップにクリームがありません。乾燥が気になる場合は、保湿アイテムを検討するきっかけに。'}</p></div>${icon('leaf')}</div><div class="list-row"><div><div class="eyebrow">02 / WEEKLY BALANCE</div><h3 style="margin-top:12px">レチノールの使用日を、カレンダーで管理。</h3><p>現在は週${state.plan.filter(p=>p==='レチノール').length}日の設定です。使用頻度は製品の案内や肌の状態に合わせて確認しましょう。</p><button class="text-link" style="margin-top:13px" onclick="navigate('calendar')">スケジュールを確認 ${icon('arrow')}</button></div></div><div class="section-head" id="recommendations" style="margin-top:32px"><h2>あなたへの商品候補</h2><span class="small">架空の商品・提案例</span></div>${suggestions.map((p,i)=>`<div class="list-row" style="align-items:flex-start"><div class="product-art" style="width:75px;height:90px"><div class="bottle ${p.art}" style="transform:scale(1.35)"></div></div><div style="flex:1"><div class="small">${p.brand}</div><h3 style="margin-top:5px">${p.name}</h3><p>${p.reason}</p><button class="text-link" style="margin-top:12px" onclick="saveSuggestion(${i})">${state.saved.includes(i)?'✓ 保存済み':'＋ 気になるリストに保存'}</button></div></div>`).join('')}<div class="note">${icon('spark')}実際のAI解析・商品検索には接続していないデモです。</div>`}function saveSuggestion(i){state.saved=state.saved.includes(i)?state.saved.filter(n=>n!==i):[...state.saved,i];save();render();toast(state.saved.includes(i)?'気にな function recordsPage(){return heading('','記録','肌・睡眠・ニキビ・美容施術の変化を振り返る。')+(!state.customSetup?'<span class="sample-label">サンプルの記録を表示中</span>':'')+`<div class="toolbar"><h2 style="font-size:14px;font-weight:500">睡眠の記録</h2><button class="btn primary" onclick="openRecord()">＋ 記録を追加</button></div>${state.records.length?`<div class="chart">${state.records.slice(0,7).reverse().map(r=>`<div class="bar" style="height:${Math.min(100,Math.max(0,Number(r.sleep)/24*100))}%"><span>${esc(r.sleep)}h</span><i>${esc(r.date.slice(5).replace('-','/'))}</i></div>`).join('')}</div>`:''}<div class="section-head" style="margin-top:50px"><h2>記録のタイムライン</h2><span class="small">${state.records.length} 件</span></div>${state.records.length?state.records.map((r,i)=>`<div class="list-row"><div><div class="eyebrow">${esc(r.date.replaceAll('-',' / '))}</div><h3 style="margin-top:12px">${esc(r.mood)} <span class="small">・睡眠 ${esc(r.sleep)}時間</span></h3><span class="tag">ニキビ：${esc(r.acne)}</span>${r.treatment?`<span class="tag">施術：${esc(r.treatment)}</span>`:''}<p>${esc(r.memo)}</p></div><button class="delete" onclick="deleteRecord(${i})">削除</button></div>`).join(''):'<div class="empty">最初の記録を残してみましょう。</div>'}`}
function deleteRecord(i){state.records.splice(i,1);save();render();toast('記録を削除しました')}
const questions=[{title:'洗顔後、肌はどんな状態ですか？',options:['全体的につっぱる','Tゾーンだけ皮脂が出る','全体的に皮脂が出る','気にならない']},{title:'最近、気になることは？',options:['乾燥','毛穴・皮脂','ニキビ','特になし']},{title:'化粧品で刺激を感じますか？',options:['よく感じる','ときどき感じる','ほとんど感じない']}];function diagnosisPage(){if(diagnosisStep>=3)return heading('SKIN PROFILE','あなたの肌プロフィール','回答をもとにしたセルフチェックの参考結果です。')+`<div class="result"><span class="eyebrow">YOUR SKIN TYPE</span><h2>${esc(state.skin)}</h2><p class="sub">${answers[0]===1?'Tゾーンと頬で、使用感の違いを記録してみましょう。':'日ごとの肌の変化を、ケアの記録と一緒に振り返りましょう。'}</p><span class="tag">気になること：${esc(questions[1].options[answers[1]])}</span><span class="tag">刺激：${esc(questions[2].options[answers[2]])}</span></div><button class="btn primary" onclick="navigate('ai')">プロフィールに合う提案例を見る ${icon('arrow')}</button><button class="text-link" style="display:block;margin-top:20px" onclick="diagnosisStep=0;answers=[];render()">もう一度チェックする</button><p class="small" style="margin-top:25px">このセルフチェックは医療上の診断ではありません。</p>`;let q=questions[diagnosisStep];return heading('SKIN CHECK','今の肌を、知る。','3つの質問で、肌のプロフィールを作りましょう。')+`<div class="eyebrow" style="margin-top:45px">QUESTION 0${diagnosisStep+1} / 03</div><h2 style="font-size:20px;font-weight:500;margin-top:18px">${q.title}</h2><div class="diagnosis-choices">${q.options.map((o,i)=>`<button class="choice ${answers[diagnosisStep]===i?'selected':''}" onclick="answers[diagnosisStep]=${i};render()">${o}</button>`).join('')}</div><button class="btn primary" onclick="nextQuestion()">${diagnosisStep===2?'結果を見る':'次の質問へ'} ${icon('arrow')}</button>${diagnosisStep?`<button class="text-link" style="margin-left:18px" onclick="diagnosisStep--;render()">戻る</button>`:''}`}function nextQuestion(){if(answers[diagnosisStep]===undefined){toast('回答を選んでください');return}diagnosisStep++;if(diagnosisStep===3){state.skin=['乾燥肌傾向','混合肌傾向','脂性肌傾向','普通肌傾向'][answers[0]];save()}render()}
function modal(title,html){document.getElementById('overlay').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div role="dialog" aria-modal="true" aria-label="${esc(title)}" class="modal"><div class="modal-header"><h2>${title}</h2><button class="close" onclick="closeModal()" aria-label="閉じる">×</button></div>${html}</div></div>`;document.querySelector('.modal input,.modal select,.modal button')?.focus()}function closeModal(){document.getElementById('overlay').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function openProduct(){modal('アイテムを追加',`<form onsubmit="addProduct(event)"><div class="field"><label for="product-name">アイテム名</label><input id="product-name" name="name" placeholder="例：モイスチャーローション" required maxlength="70"></div><div class="field"><label for="product-brand">ブランド</label><input id="product-brand" name="brand" placeholder="例：SKINS LAB" required maxlength="50"></div><div class="form-grid"><div class="field"><label for="product-type">ステップ</label><select id="product-type" name="type">${['クレンジング','洗顔料','化粧水','美容液','乳液','クリーム','日焼け止め','その他'].map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label for="product-time">使う時間</label><select id="product-time" name="time"><option value="am" ${time==='am'?'selected':''}>朝</option><option value="pm" ${time==='pm'?'selected':''}>夜</option></select></div></div><button class="btn primary" type="submit">ルーティンに追加する</button></form>`)}function addProduct(e){e.preventDefault();const f=new FormData(e.target);const name=f.get('name').trim(),brand=f.get('brand').trim();if(!name||!brand){toast('アイテム名とブランドを入力してください');return}state.products.push({id:Date.now(),name,brand,type:f.get('type'),time:f.get('time'),art:f.get('type')==='クリーム'?'jar':'white'});time=f.get('time');save();closeModal();render();toast('ルーティンに追加しました')}
function openPlan(i){modal(`${dayName[i]}曜日のケア`, `<form onsubmit="event.preventDefault();state.plan[${i}]=this.plan.value;save();closeModal();render();toast('週間プランを更新しました')"><div class="field"><label for="plan">ケアの方針</label><select id="plan" name="plan">${['保湿','レチノール','お休み','スペシャルケア'].map(p=>`<option ${state.plan[i]===p?'selected':''}>${p}</option>`).join('')}</select></div><p class="small">毎週の${dayName[i]}曜日に反映されます。</p><button class="btn primary">保存する</button></form>`)}
function openRecord(){modal('今日の肌を記録',`<form onsubmit="addRecord(event)"><div class="form-grid"><div class="field"><label for="record-date">日付</label><input id="record-date" type="date" name="date" value="2026-10-24" required></div><div class="field"><label for="record-mood">肌の調子</label><select id="record-mood" name="mood"><option>良い</option><option>ふつう</option><option>ゆらぎ気味</option><option>乾燥が気になる</option></select></div><div class="field"><label for="record-sleep">睡眠時間</label><input id="record-sleep" type="number" name="sleep" min="0" max="24" step="0.5" value="7" required></div><div class="field"><label for="record-acne">ニキビの場所</label><select id="record-acne" name="acne"><option>なし</option><option>おでこ</option><option>右頬</option><option>左頬</option><option>鼻</option><option>あご</option><option>フェイスライン</option><option>複数箇所（メモに記入）</option></select></div></div><div class="field"><label for="record-treatment">美容施術（任意）</label><input id="record-treatment" name="treatment" placeholder="施術名・クリニック・経過など" maxlength="150"></div><div class="field"><label for="record-memo">肌のメモ</label><textarea id="record-memo" name="memo" placeholder="気づいた変化、使ったアイテムなど" maxlength="1000"></textarea></div><button class="btn primary">記録を保存する</button></form>`)}function addRecord(e){e.preventDefault();const r=Object.fromEntries(new FormData(e.target));state.records.unshift(r);state.records.sort((a,b)=>b.date.localeCompare(a.date));save();closeModal();render();toast('肌の記録を保存しました')}
function openChat(){modal('Skins AIに相談',`<div class="small">デモチャット・定型の回答を表示します</div><div id="messages">${chat.map(c=>`<div class="chat-msg ${c.role}">${esc(c.text)}</div>`).join('')||'<div class="chat-msg">こんにちは。登録しているケアや、気になることを聞かせてください。</div>'}</div><form class="chat-compose" onsubmit="sendChat(event)"><input name="message" aria-label="相談内容" placeholder="例：夜のケアを見直したい" required maxlength="500"><button class="btn primary" style="width:auto">送信</button></form>`)}function sendChat(e){e.preventDefault();let q=e.target.message.value.trim();if(!q)return;chat.push({role:'user',text:q});let reply=/ニキビ/.test(q)?'いつ・どこにできたかを肌の記録に残すと、変化を振り返れます。症状が続く場合や痛みがある場合は、皮膚科で相談してください。':/睡眠/.test(q)?'睡眠時間と肌の調子を一緒に記録してみましょう。記録画面で日ごとの変化を確認できます。':`現在、${state.products.length}点のアイテムが登録されています。まずは朝と夜の使用感を記録し、乾燥や刺激があった日を振り返ってみましょう。AIエージェント画面にも見直しのヒントがあります。`;chat.push({role:'ai',text:reply});openChat();document.querySelector('.modal').scrollTop=9999}let toastTimer;function toast(t){document.getElementById('toast').innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',3000)}
// Progressive, task-first navigation.
function backToCare(){return `<button class="back-link" onclick="navigate('routine')">‹ マイケアに戻る</button>`}
function taskProducts(){return state.products.filter(p=>p.time===time&&(!p.name.includes('レチノール')||state.plan[5]==='レチノール'))}
function taskStatus(){const ps=taskProducts();return {ps,done:ps.filter(p=>state.done['2026-10-24-'+time+'-'+p.id]).length,record:state.records.find(r=>r.date==='2026-10-24')}}
function home(){selectedDay=5;weekOffset=0;const t=taskStatus(),complete=t.ps.length>0&&t.done===t.ps.length;return heading('','今日のケア','いつものケアをチェックして、今日の肌を残しましょう。')+
(!state.welcomed?`<section class="start-guide"><div><span class="eyebrow">はじめての方へ</span><h2>まずは、いつものケアを登録。</h2><p>肌質 → アイテム → 週間予定の3ステップ。<br>今はサンプルのアイテムと記録を表示しています。</p></div><div class="start-actions"><button class="btn primary" onclick="startSetup()">自分のケアを登録 ${icon('arrow')}</button><button class="quiet-link" onclick="state.welcomed=true;save();render()">サンプルのまま試す</button></div></section>`:'')+
`<div class="day-context"><span>${icon('moon')} 今夜は <b>${esc(state.plan[5])}</b> の日</span><button class="text-link" onclick="navigate('routine')">週間予定を確認 ${icon('chev')}</button></div><div class="section-head routine-title"><h2>いつものスキンケア</h2>${!state.customSetup?'<span class="sample-label">サンプル</span>':''}</div><div id="today-routine">${products()}</div>`+
(complete?`<div class="completion">${icon('check')}<div><h3>${time==='am'?'朝':'夜'}のケアが完了しました</h3><p>${t.record?'肌の記録も保存できています。おつかれさまでした。':'次は今日の肌を記録しておきましょう。'}</p></div></div>`:`<div class="routine-actions"><span class="small">${t.ps.length?`あと${t.ps.length-t.done}ステップ`:'アイテムを追加してはじめましょう'}</span>${t.ps.length?`<button class="btn primary" onclick="completeCare()">${time==='am'?'朝':'夜'}のケアを完了する ${icon('check')}</button>`:`<button class="btn primary" onclick="openProduct()">アイテムを追加</button>`}</div>`)+
`<section class="journal-next"><div class="journal-title"><span class="step-number">${t.record?'✓':'2'}</span><div><h3>${t.record?'今日の肌は記録済み':'今日の肌を、30秒で記録。'}</h3><p>${t.record?`${esc(t.record.mood)} ・ 睡眠 ${esc(t.record.sleep)}時間`:'肌の調子と睡眠だけでも大丈夫。'}</p></div></div><button class="btn ${complete&&!t.record?'primary':''}" onclick="${t.record?"navigate('records')":"openRecord()"}">${t.record?'記録を見る':'肌を記録する'} ${icon('arrow')}</button></section><section class="context-ai">${icon('spark')}<div><strong>ケアを見直したくなったら</strong><p>使っているアイテムと肌質から、改善のヒントを確認。</p></div><button class="text-link" onclick="navigate('ai')">提案を見る ${icon('arrow')}</button></section><div class="bottom-caption"><span>${state.customSetup?'自分のケアで記録中':'サンプルのアイテム・記録を表示中'}</span><span>SKINS JOURNAL</span></div>`}
function completeCare(){taskProducts().forEach(p=>state.done['2026-10-24-'+time+'-'+p.id]=true);save();render();toast('ケアの完了を保存しました')}
function routinePage(){const ds=weekDates();return heading('','マイケア','使うもの・使う日・肌のプロフィールを、ここで管理。')+`<div class="care-profile"><div class="avatar">${icon('skin')}</div><div><h3>${esc(state.skin)}</h3><span class="small">肌プロフィール${!state.customSetup?'（サンプル）':''}</span></div><button class="text-link" onclick="navigate('diagnosis')">肌質をチェック ${icon('arrow')}</button></div><div class="section-head"><h2>使っているアイテム</h2><button class="btn" onclick="openProduct()">＋ 追加する</button></div>${products()}<details class="care-section" id="week-planner"><summary><div>1週間の予定<small>レチノール：${state.plan.map((p,i)=>p==='レチノール'?dayName[i]:'').filter(Boolean).join('・')||'設定なし'} ／ それ以外は保湿の日</small></div></summary><p class="small">曜日を選んで、その日のケアを変更できます。毎週繰り返されます。</p><div class="calendar-week">${state.plan.map((p,i)=>`<div class="calendar-cell"><span class="small">${dayName[i]}曜日</span><button onclick="openPlan(${i})">${icon(p==='レチノール'?'moon':'leaf')}<br>${esc(p)}<br><span style="font-size:8px">変更</span></button></div>`).join('')}</div></details><section class="care-section"><div class="section-head"><h2>ケアの見直し</h2><span class="sample-label">AIデモ</span></div><div class="context-ai" style="padding:4px 0 15px">${icon('spark')}<div><strong>${state.products.length}点のラインナップを確認できます</strong><p>今のケアへのヒントと、肌質に合わせた商品候補。</p></div></div><div class="care-links"><button class="btn primary" onclick="navigate('ai')">改善提案を見る ${icon('arrow')}</button><button class="text-link" onclick="openChat()">AIに相談する</button></div></section><section class="care-section"><div class="care-links"><div><h3 style="font-size:12px;font-weight:500;margin:0 0 6px">${state.customSetup?'肌質・予定をまとめて設定':'自分のケアに切り替える'}</h3><span class="small">肌質・アイテム・週間予定をまとめて設定。</span></div><button class="text-link" onclick="startSetup()">登録する ${icon('arrow')}</button></div></section>`}
function renderRail(){document.getElementById('rail').innerHTML=''}
const previousAIPage=aiPage;aiPage=function(){return backToCare()+previousAIPage()};const previousDiagnosisPage=diagnosisPage;diagnosisPage=function(){return backToCare()+previousDiagnosisPage()};
let setupDraft;
function startSetup(){setupDraft={skin:state.customSetup?state.skin:'',name:'',brand:'',type:'化粧水',time:'am',ret:[]};setupSkin()}
function setupMeter(i){return `<div class="setup-progress">${[0,1,2].map(n=>`<span class="${n<=i?'active':''}"></span>`).join('')}</div><div class="setup-caption">${i+1} / 3　${['肌プロフィール','最初のアイテム','週間予定'][i]}</div>`}
function setupSkin(){modal('自分のケアをはじめる',setupMeter(0)+`<p style="font-size:15px">自分の肌に近いものは？</p><p class="muted-note">あとから肌質チェックで見直せます。</p>${['乾燥肌','混合肌','脂性肌','普通肌','まだわからない'].map((v,i)=>`<button class="setup-choice" onclick="setupDraft.skin=['乾燥肌','混合肌','脂性肌','普通肌','まだわからない'][${i}];setupProduct()">${v}${icon('chev')}</button>`).join('')}`)}
function setupProduct(){modal('いつも使うものを1つ',setupMeter(1)+`<p class="muted-note">まずは1つで大丈夫。残りはマイケアで追加できます。</p><form onsubmit="setupSaveProduct(event)"><div class="field"><label for="setup-name">アイテム名</label><input id="setup-name" name="name" value="${esc(setupDraft.name)}" placeholder="例：いつもの保湿化粧水" maxlength="70" required></div><div class="field"><label for="setup-brand">ブランド（任意）</label><input id="setup-brand" name="brand" value="${esc(setupDraft.brand)}" maxlength="50"></div><div class="form-grid"><div class="field"><label for="setup-type">種類</label><select id="setup-type" name="type">${['化粧水','洗顔料','美容液','クリーム','日焼け止め','クレンジング','乳液','その他'].map(v=>`<option ${setupDraft.type===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="setup-time">使う時間</label><select id="setup-time" name="time"><option value="am" ${setupDraft.time==='am'?'selected':''}>朝</option><option value="pm" ${setupDraft.time==='pm'?'selected':''}>夜</option><option value="both" ${setupDraft.time==='both'?'selected':''}>朝と夜</option></select></div></div><button class="btn primary">週間予定へ ${icon('arrow')}</button><button type="button" class="text-link" style="margin-top:16px" onclick="setupSkin()">‹ 肌プロフィールに戻る</button></form>`)}
function setupSaveProduct(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!f.name.trim()){toast('アイテム名を入力してください');return}Object.assign(setupDraft,f);setupWeek()}
function setupWeek(){modal('1週間のケアを決める',setupMeter(2)+`<p style="font-size:15px;line-height:1.8">レチノールを使う日はありますか？</p><p class="muted-note">使う曜日を選んでください。使わない方は、そのまま登録できます。</p><div class="week-grid-setup">${dayName.map((v,i)=>`<button class="${setupDraft.ret.includes(i)?'selected':''}" aria-pressed="${setupDraft.ret.includes(i)}" onclick="setupDraft.ret=setupDraft.ret.includes(${i})?setupDraft.ret.filter(n=>n!==${i}):[...setupDraft.ret,${i}];setupWeek()">${v}</button>`).join('')}</div><p class="muted-note">選択した日以外は「保湿」に設定します。製品の案内や肌の状態に合わせて調整しましょう。</p><button class="btn primary" onclick="finishSetup()">この内容でケアをはじめる ${icon('check')}</button><button class="text-link" style="margin-top:16px" onclick="setupProduct()">‹ アイテムに戻る</button><p class="muted-note">${state.customSetup?'今のアイテム・記録は残し、新しいアイテムを追加します。肌質と週間予定は更新されます。':'サンプルのアイテム・記録は、自分用のデータに切り替わります。'}</p>`)}
function finishSetup(){const d=setupDraft,id=Date.now();state.skin=d.skin;state.products=[...(state.customSetup?state.products:[]),...(d.time==='both'?['am','pm']:[d.time]).map((t,i)=>({id:id+i,type:d.type,name:d.name.trim(),brand:d.brand.trim()||'MY SKINCARE',art:d.type==='クリーム'?'jar':'white',time:t}))];if(!state.customSetup){state.records=[];state.done={}}state.plan=dayName.map((_,i)=>d.ret.includes(i)?'レチノール':'保湿');state.welcomed=true;state.customSetup=true;time=d.time==='pm'?'pm':'am';save();closeModal();navigate('home');toast('自分のケアを登録しました')}
function openRecord(){const existing=state.records.find(r=>r.date===weekDates()[selectedDay].key);modal('肌を記録',`<form onsubmit="addRecord(event)"><div class="setup-caption">SKIN JOURNAL</div><div class="field"><label for="record-date">日付</label><input id="record-date" type="date" name="date" value="${weekDates()[selectedDay].key}" required></div><div class="form-grid"><div class="field"><label for="record-mood">肌の調子</label><select id="record-mood" name="mood">${['良い','ふつう','ゆらぎ気味','乾燥が気になる'].map(v=>`<option ${existing?.mood===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="record-sleep">睡眠時間</label><input id="record-sleep" type="number" name="sleep" min="0" max="24" step="0.5" value="${esc(existing?.sleep||7)}" required></div></div><details class="optional-fields"><summary>＋ ニキビ・施術・メモを追加（任意）</summary><div class="field"><label for="record-acne">ニキビの場所</label><select id="record-acne" name="acne">${['なし','おでこ','右頬','左頬','鼻','あご','フェイスライン','複数箇所（メモに記入）'].map(v=>`<option ${existing?.acne===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="record-treatment">美容施術</label><input id="record-treatment" name="treatment" value="${esc(existing?.treatment||'')}" placeholder="施術名・クリニック・経過など" maxlength="150"></div><div class="field"><label for="record-memo">肌のメモ</label><textarea id="record-memo" name="memo" maxlength="1000" placeholder="気になったこと、ニキビの数など">${esc(existing?.memo||'')}</textarea></div></details><button class="btn primary">保存する</button></form>`)}
function addRecord(e){e.preventDefault();const r=Object.fromEntries(new FormData(e.target));state.records=state.records.filter(x=>x.date!==r.date);state.records.unshift(r);state.records.sort((a,b)=>b.date.localeCompare(a.date));save();closeModal();render();toast('今日の肌を記録しました')}

function openProduct(){modal('アイテムを追加',`<form onsubmit="addProduct(event)"><div class="field"><label for="product-name">アイテム名</label><input id="product-name" name="name" placeholder="例：モイスチャーローション" required maxlength="70"></div><div class="field"><label for="product-brand">ブランド（任意）</label><input id="product-brand" name="brand" placeholder="例：SKINS LAB" maxlength="50"></div><div class="form-grid"><div class="field"><label for="product-type">種類</label><select id="product-type" name="type">${['クレンジング','洗顔料','化粧水','美容液','乳液','クリーム','日焼け止め','その他'].map(v=>`<option>${v}</option>`).join('')}</select></div><div class="field"><label for="product-time">使う時間</label><select id="product-time" name="time"><option value="am" ${time==='am'?'selected':''}>朝</option><option value="pm" ${time==='pm'?'selected':''}>夜</option><option value="both">朝と夜</option></select></div></div><button class="btn primary">アイテムを追加する</button></form>`)}
function addProduct(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),name=f.name.trim();if(!name){toast('アイテム名を入力してください');return}const id=Date.now();(f.time==='both'?['am','pm']:[f.time]).forEach((t,i)=>state.products.push({id:id+i,name,brand:f.brand.trim()||'MY SKINCARE',type:f.type,time:t,art:f.type==='クリーム'?'jar':'white'}));time=f.time==='pm'?'pm':'am';save();closeModal();render();toast('アイテムを追加しました')}

function cosmetic(p,suffix=''){const u='b'+p.id+suffix;const amber=p.art==='amber';const jar=p.type==='クリーム'||p.art==='jar';const tube=p.type==='洗顔料'||p.type==='日焼け止め';const pump=p.type==='クレンジング';const colors=amber?['#e6d1b7','#b58d65','#8c6349']:p.type==='化粧水'?['#b9d5f1','#6e9ed0','#4374aa']:['#ffffff','#e1e9f3','#9bafc8'];const brand=esc((p.brand||'SKINS').split(' ')[0]);let shape='';if(jar){shape=`<rect x="13" y="88" width="64" height="39" rx="10" fill="url(#${u}glass)" stroke="#7f99b9" stroke-width=".65"/><rect x="12" y="82" width="66" height="12" rx="4" fill="url(#${u}cap)"/><path d="M19 96v20q0 6 5 6" stroke="#fff" stroke-opacity=".85" stroke-width="2" fill="none"/><rect x="29" y="99" width="32" height="18" rx="1" fill="#fff" fill-opacity=".7"/>`;}else if(tube){shape=`<path d="M23 29h44l-5 88H28Z" fill="url(#${u}glass)" stroke="#7f99b9" stroke-width=".65"/><rect x="23" y="27" width="44" height="4" rx="1" fill="#d3e0ef"/><path d="M26 33h38M27 36h36" stroke="#fff" stroke-opacity=".6" stroke-width="1"/><rect x="28" y="114" width="34" height="14" rx="2" fill="url(#${u}cap)"/><path d="M31 40 34 109" stroke="#fff" stroke-width="2" stroke-opacity=".8"/>`;}else if(amber){shape=`<rect x="39" y="19" width="12" height="24" rx="6" fill="#fbfcff"/><rect x="33" y="37" width="24" height="16" rx="3" fill="url(#${u}cap)"/><path d="M34 52h22l7 11v58q0 7-7 7H34q-7 0-7-7V63Z" fill="url(#${u}glass)" stroke="#7f99b9" stroke-width=".65"/><rect x="27" y="76" width="36" height="34" rx="1" fill="#faf8f3" fill-opacity=".9"/><path d="M31 63v55" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>`;}else if(pump){shape=`<path d="M36 25h18v15H36z" fill="#dce8f5"/><rect x="35" y="20" width="35" height="7" rx="2" fill="#f7faff"/><rect x="31" y="38" width="28" height="10" rx="2" fill="url(#${u}cap)"/><rect x="25" y="47" width="40" height="81" rx="6" fill="url(#${u}glass)" stroke="#7f99b9" stroke-width=".65"/><path d="M45 48v70" stroke="#fff" stroke-width="1" stroke-opacity=".5"/><rect x="25" y="75" width="40" height="32" fill="#f8fbff" fill-opacity=".7"/><path d="M29 54v62" stroke="#fff" stroke-width="2" stroke-opacity=".7"/>`;}else{shape=`<rect x="31" y="15" width="28" height="22" rx="3" fill="url(#${u}cap)"/><path d="M32 36h26q7 0 7 8v77q0 7-7 7H32q-7 0-7-7V44q0-8 7-8" fill="url(#${u}glass)" stroke="#7f99b9" stroke-width=".65"/><rect x="25" y="68" width="40" height="36" fill="#f9fcff" fill-opacity=".65"/><path d="M30 43v72" stroke="#fff" stroke-width="2" stroke-opacity=".7"/>`;}
const ty=jar?108:tube?77:amber?91:87;return `<svg class="cosmetic" viewBox="0 0 90 132" aria-hidden="true"><defs><linearGradient id="${u}glass" x1="0" x2="1"><stop stop-color="${colors[2]}"/><stop offset=".18" stop-color="${colors[0]}"/><stop offset=".42" stop-color="${colors[1]}"/><stop offset=".8" stop-color="${colors[0]}"/><stop offset="1" stop-color="${colors[2]}"/></linearGradient><linearGradient id="${u}cap" x1="0" x2="1"><stop stop-color="#d0ddec"/><stop offset=".4" stop-color="#ffffff"/><stop offset="1" stop-color="#d4e1f0"/></linearGradient><radialGradient id="${u}shadow"><stop stop-color="#53749c" stop-opacity=".18"/><stop offset="1" stop-color="#53749c" stop-opacity="0"/></radialGradient></defs><ellipse cx="45" cy="131" rx="35" ry="5" fill="url(#${u}shadow)"/>${shape}<text x="45" y="${ty-5}" fill="${amber?'#61442f':'#254c7c'}" text-anchor="middle" font-family="Georgia,serif" font-size="${jar?7:9}" letter-spacing="-.4">${brand==='SKINS'?'skins.':brand==='BOTANICAL'?'botanical.':'daily.'}</text><text x="45" y="${ty+3}" text-anchor="middle" fill="${amber?'#9c8b76':'#93a9c4'}" font-size="2.6" letter-spacing="1" font-family="sans-serif">${jar?'MOISTURE':amber?'SKIN SERUM':tube?'DAILY CARE':'SKIN ESSENTIALS'}</text><text x="45" y="${ty+10}" text-anchor="middle" fill="#96a9bf" font-family="sans-serif" font-size="2.7">${jar?'50 g':amber?'30 ml':'120 ml'}</text></svg>`}
function shelfProducts(t){return state.products.filter(p=>p.time===t)}
function shelfKey(t,id){return weekDates()[selectedDay].key+'-'+t+'-'+id}
function onRest(p){return p.name.includes('レチノール')&&state.plan[selectedDay]!=='レチノール'}

function shelfRow(t){const ps=shelfProducts(t),active=ps.filter(p=>!onRest(p)),done=active.filter(p=>state.done[shelfKey(t,p.id)]).length;return `<section class="shelf-row" data-count="${ps.length}"><div class="shelf-label"><h2>${icon(t==='am'?'sun':'moon')}${t==='am'?'朝':'夜'}<small>${t==='am'?'MORNING':'EVENING'}</small></h2><div class="shelf-finish"><span>${ps.length}点</span>${ps.length>3?`<div class="shelf-paging"><button onclick="slideShelf('${t}',-1)" aria-label="${t==='am'?'朝':'夜'}の棚を左へ">‹</button><button onclick="slideShelf('${t}',1)" aria-label="${t==='am'?'朝':'夜'}の棚を右へ">›</button></div>`:''}<button class="${active.length&&done===active.length?'finished':''}" onclick="finishShelf('${t}')" aria-label="${t==='am'?'朝':'夜'}のケアをまとめて完了">${icon('check')}</button></div></div><div class="shelf-track" id="track-${t}" onscroll="syncShelfPagers()" style="--desktop-count:${Math.min(Math.max(ps.length,1),8)};--compact-count:${Math.min(Math.max(ps.length,1),4)};--small-count:${Math.min(Math.max(ps.length,1),3)}">${ps.length?ps.map(p=>`<button class="shelf-slot ${state.done[shelfKey(t,p.id)]?'done':''} ${onRest(p)?'rest':''}" onclick="openShelfItem(${p.id})" aria-label="${esc(p.name)}${onRest(p)?'・今日はお休み':''}"><span class="slot-art">${cosmetic(p,t)}${state.done[shelfKey(t,p.id)]?`<span class="slot-check">${icon('check')}</span>`:onRest(p)?'<span class="slot-rest">休</span>':''}</span><span class="slot-caption">${esc(p.type)}</span></button>`).join(''):`<div class="shelf-empty"><button onclick="time='${t}';openProduct()" aria-label="${t==='am'?'朝':'夜'}のアイテムを追加">＋</button></div>`}</div></section>`}
function slideShelf(t,dir){const el=document.getElementById('track-'+t);el.scrollTo({left:Math.max(0,Math.min(el.scrollWidth-el.clientWidth,el.scrollLeft+el.clientWidth*dir)),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}function syncShelfPagers(){document.querySelectorAll('.shelf-track').forEach(el=>{const btns=el.closest('.shelf-row').querySelectorAll('.shelf-paging button');if(btns.length){btns[0].disabled=el.scrollLeft<2;btns[1].disabled=el.scrollLeft>=el.scrollWidth-el.clientWidth-2}})}
function shelfCalendar(){const ds=weekDates();return `<section class="shelf-week"><div class="shelf-week-head"><strong>1週間</strong><div><button onclick="weekOffset--;render()" aria-label="前の週">‹</button><span>${ds[0].date.getMonth()+1}.${ds[0].day} – ${ds[6].date.getMonth()+1}.${ds[6].day}</span><button onclick="weekOffset++;render()" aria-label="次の週">›</button><button class="week-edit" onclick="openPlan(selectedDay)">編集</button></div></div><div class="mini-week">${ds.map((d,i)=>`<button class="mini-day ${i===selectedDay?'selected':''} ${state.plan[i]==='レチノール'?'ret':''}" onclick="selectedDay=${i};render()" aria-label="${d.day}日 ${state.plan[i]}を表示"><span>${dayName[i]}</span><strong>${d.day}</strong><i title="${esc(state.plan[i])}">${esc(state.plan[i]==='レチノール'?'R':state.plan[i]==='スペシャルケア'?'集中':state.plan[i]==='お休み'?'休み':state.plan[i])}</i></button>`).join('')}</div><div class="week-legend">R：レチノール</div></section>`}
function shelfHeader(manage=false){const d=weekDates()[selectedDay];return `<div class="shelf-page-head"><div><div class="eyebrow">YOUR BEAUTY CABINET</div><h1>${manage?'My collection.':'My shelf.'}</h1></div><div><span class="shelf-date">${d.date.getMonth()+1}.${d.day} ${['MON','TUE','WED','THU','FRI','SAT','SUN'][selectedDay]}</span><div class="shelf-tools">${!state.customSetup?'<span class="sample-label">サンプル</span>':''}<button class="round-add" aria-label="コスメを追加" onclick="openProduct()">＋</button></div></div></div>`}
function home(){const r=state.records.find(r=>r.date===weekDates()[selectedDay].key);return `<div class="shelf-page">${shelfHeader()}<div class="vanity">${shelfRow('am')}${shelfRow('pm')}${shelfCalendar()}</div><div class="shelf-footer"><div class="shelf-journal"><span class="journal-icon">${icon('skin')}</span><div><strong>${r?esc(r.mood):'今日の肌'}</strong><small>${r?`睡眠 ${esc(r.sleep)}h`:'まだ記録がありません'}</small></div></div><button class="btn primary" onclick="openRecord()">${r?'記録を編集':'肌を記録'} ＋</button></div><button class="shelf-ai" onclick="navigate('ai')">${icon('spark')}<span>${state.plan[selectedDay]==='レチノール'?'レチノールの日。今夜のケアをチェック':'今のラインナップ、Skinsと見直す'}</span><span class="arrow">↗</span></button>${!state.customSetup?'<button class="shelf-setup" onclick="startSetup()">自分の棚をつくる →</button>':''}</div>`}
function finishShelf(t){const active=shelfProducts(t).filter(p=>!onRest(p));if(!active.length){time=t;openProduct();return}const all=active.every(p=>state.done[shelfKey(t,p.id)]);active.forEach(p=>state.done[shelfKey(t,p.id)]=!all);save();render();toast(all?'チェックを戻しました':`${t==='am'?'朝':'夜'}のケア、完了 ✓`)}
function openShelfItem(id){const p=state.products.find(p=>p.id===id);if(!p)return;const rest=onRest(p),done=state.done[shelfKey(p.time,p.id)];modal(p.type,`<div class="product-detail"><div class="detail-art">${cosmetic(p,'detail')}</div><span class="eyebrow">${esc(p.brand)}</span><h3>${esc(p.name)}</h3><div class="detail-meta"><span>${p.time==='am'?'朝':'夜'}のスキンケア</span><span>${rest?'今日はおやすみ':done?'✓ 完了':'未チェック'}</span></div>${rest?'<button class="btn primary" onclick="closeModal();openPlan(selectedDay)">使用日を変更</button>':`<button class="btn primary" onclick="toggleShelfItem(${id})">${done?'完了を取り消す':'使ったらチェック ✓'}</button>`}<button class="text-link" style="margin-top:18px;color:#98a8bc" onclick="removeProduct(${id});closeModal()">棚から外す</button></div>`)}
function toggleShelfItem(id){const p=state.products.find(p=>p.id===id);const k=shelfKey(p.time,id);state.done[k]=!state.done[k];save();closeModal();render()}
function routinePage(){return `<div class="shelf-page">${shelfHeader(true)}<div class="vanity">${shelfRow('am')}${shelfRow('pm')}${shelfCalendar()}</div><div class="management-line"><div><strong>${esc(state.skin)}</strong><small>肌プロフィール</small></div><button class="text-link" onclick="navigate('diagnosis')">肌質チェック →</button></div><div class="management-line"><strong>Skinsの提案</strong><button class="text-link" onclick="navigate('ai')">見てみる ↗</button></div><div class="management-line"><strong>AIに相談</strong><button class="text-link" onclick="openChat()">相談する ↗</button></div><button class="shelf-setup" onclick="startSetup()">${state.customSetup?'プロフィール・予定をまとめて設定':'自分の棚をつくる'} →</button></div>`}
aiPage=function(){const cream=state.products.some(p=>p.time==='pm'&&p.type==='クリーム');return backToCare()+heading('','Skins picks.','')+`<div class="list-row"><div><span class="eyebrow">YOUR ROUTINE</span><h3 style="margin-top:10px">${cream?'夜の保湿、続けてみよう。':'夜の保湿を、もう少し。'}</h3><p>${cream?'肌の変化を記録してみましょう。':'今の夜ケアに、クリームは未登録です。'}</p></div>${icon('spark')}</div><div class="list-row"><div><h3>今週のレチノール</h3><p>${state.plan.map((p,i)=>p==='レチノール'?dayName[i]:'').filter(Boolean).join('・')||'設定なし'}</p></div><button class="text-link" onclick="navigate('routine')">予定を編集 →</button></div><div class="section-head" id="recommendations" style="margin-top:30px"><h2>気になる、次の1本。</h2><span class="sample-label">商品はデモ</span></div>${suggestions.map((p,i)=>`<div class="list-row"><div style="width:70px;flex-shrink:0">${cosmetic({...p,id:100+i},'rec')}</div><div style="flex:1"><span class="small">${p.brand}</span><h3 style="margin-top:7px">${p.name}</h3><p>${i===0?'乾燥が気になる日の保湿に。':'洗いあがりの使用感を比べたいときに。'}</p><button class="text-link" style="margin-top:12px" onclick="saveSuggestion(${i})">${state.saved.includes(i)?'✓ 保存済み':'＋ 保存する'}</button></div></div>`).join('')}<p class="muted-note">AI・商品提案はデモです。</p>`};

window.addEventListener('resize',syncShelfPagers);
render();
</script></body></html>
